    severity: medium
    finding: 'HTMX tab switch only swaps #tab-content — tab navigation bar retains old active class and aria-selected state, showing wrong tab as active'
    suggested_action: 'Add client-side active state toggle via hx-on:click, or use hx-swap-oob, or wrap tabs + content in a common HTMX target'
    suggested_owner: dev
  - id: 'SCOPE-001'
    severity: low
    finding: 'Events-tab and deaths-tab partials are fully functional instead of placeholder empty states per Task 15 spec — creates dependency on Story 3.3 content'
