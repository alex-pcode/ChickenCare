nfr_validation:
  security:
    status: PASS
    notes: >
      Ownership enforced via premium middleware, Gate::authorize(), and
      $request->user()->expenses() scoping. user_id excluded from $fillable.
      Category filter uses parameterized Eloquent query — no injection risk.
  performance:
    status: PASS
    notes: >
      paginate(15)->withQueryString() preserves category param through pagination.
      idx_expenses_user_date index covers the primary query pattern.
      No relationships needed at display time — no N+1 risk.
  reliability:
    status: PASS
    notes: >
      HTMX dual-response bug fixed. Empty-state guard added to table partial for
      filtered zero-result views. Standard navigation fallback works correctly.
  maintainability:
    status: PASS
    notes: >
      Shared ExpenseRequest base class extracted; StoreExpenseRequest and
      UpdateExpenseRequest now delegate to it. Five update-path validation tests
      added for full symmetry with store validation coverage.

