  security:
    status: PASS
    notes: 'Conservative blanket private, no-store eliminates back-button replay of session-bound HTML/JSON and keeps CSRF-token-bearing guest pages out of shared caches.'
  performance:
    status: PASS
    notes: 'One header set + two header removes per response. Loss of 304 revalidation on dynamic responses is the intended trade-off.'
  reliability:
    status: PASS
    notes: 'Single ownership point; BinaryFileResponse/StreamedResponse skip prevents accidental rewrite of file/stream semantics.'
  maintainability:
    status: PASS
    notes: 'Small, single-purpose middleware; one registration site in bootstrap/app.php; comprehensive feature coverage prevents regressions.'

