top_issues:
  - id: 'BUG-001'
    severity: medium
    finding: 'FlockProfileController::update HTMX branch passes $flockProfile but flock-overview.blade.php expects $profile — migration notice never renders after HTMX update'
    suggested_action: 'Rename variable in compact() or assign $profile = $flockProfile before the view call'
    suggested_owner: dev
  - id: 'AUTH-001'
    severity: medium
    finding: 'FlockEventController::create returns event form without verifying user owns the FlockProfile — any premium user can load form for another users profile'
    suggested_action: 'Add Gate::authorize("view", $flockProfile) to the create method'
    suggested_owner: dev
  - id: 'POLICY-001'
    severity: medium
    finding: 'FlockEventPolicy::create(User, FlockEvent) has wrong signature — Laravel create gate is invoked before model exists; second parameter should be FlockProfile or removed'
    suggested_action: 'Change to create(User $user) or create(User $user, FlockProfile $flockProfile) and wire up accordingly'
    suggested_owner: dev

