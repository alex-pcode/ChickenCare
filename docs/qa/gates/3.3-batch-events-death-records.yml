    - action: 'Wrap DeathRecordController store/update/destroy in DB::transaction()'
      refs: ['app/Http/Controllers/DeathRecordController.php:26-41', 'app/Http/Controllers/DeathRecordController.php:52-69', 'app/Http/Controllers/DeathRecordController.php:72-86']
    - action: 'Add $batch->decrement("current_count", $totalDeaths) to DeathRecordSeeder after inner loop'
      refs: ['database/seeders/DeathRecordSeeder.php:39']
  future:
    - action: 'Eager-load flockBatch relationship before policy checks to avoid N+1'
      refs: ['app/Policies/BatchEventPolicy.php:18', 'app/Policies/DeathRecordPolicy.php:18']
