  totals: { critical: 0, high: 0, medium: 2, low: 2 }
  recommendations:
    must_fix:
      - 'Wrap death record CRUD operations in DB::transaction()'
      - 'Fix DeathRecordSeeder to decrement batch current_count'
    monitor:
