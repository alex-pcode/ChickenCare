schema: 1
story: '3.3'
story_title: 'Batch Events & Death Records'
gate: CONCERNS
status_reason: 'Death record CRUD operations lack DB::transaction wrapping — record creation/update/deletion and count adjustment are not atomic, risking current_count inconsistency. Seeder also doesn not adjust batch counts.'
reviewer: 'Quinn (Test Architect)'
updated: '2026-04-12T16:00:00Z'

waiver: { active: false }

top_issues:
  - id: 'DATA-001'
    severity: medium
    finding: 'DeathRecordController store/update/destroy perform record CRUD and current_count adjustment as separate non-transactional operations — if either fails, batch count diverges from actual death records'
    suggested_action: 'Wrap each mutating action in DB::transaction() — store (create + decrement), update (increment + decrement + update), destroy (increment + delete)'
    suggested_owner: dev
  - id: 'SEED-001'
    severity: medium
    finding: 'DeathRecordSeeder creates death records but never decrements FlockBatch.current_count — seeded data has incorrect bird counts'
    suggested_action: 'Add $batch->decrement("current_count", $totalDeaths) after the inner seeding loop'
    suggested_owner: dev

